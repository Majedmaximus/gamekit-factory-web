<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1726">
<meta name="description" content="Play a free bilingual daily sliding puzzle. Works offline on your phone, no account needed.">
<meta property="og:title" content="Slide 15 • GameKit Factory">
<meta property="og:description" content="A new free puzzle every day. Try the offline browser demo.">
<meta property="og:type" content="website">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="stylesheet" href="./style.css">
<title>Slide 15 • GameKit Factory</title>
</head>
<body>
<main class="app">
<header>
<div class="overline">GAMEKIT FACTORY · FREE DEMO</div>
<h1 id="title">Slide 15</h1>
<p id="subtitle">A new puzzle every day. No login or tracking.</p>
</header>
<div class="actions" aria-label="Game actions">
<button type="button" id="daily">Daily puzzle</button>
<button type="button" id="new">New game</button>
<button type="button" id="language">العربية</button>
</div>
<div id="mode" class="mode"></div>
<div id="board" class="board" role="group" aria-label="Sliding puzzle board"></div>
<div class="actions secondary">
<button type="button" id="undo">Undo</button>
<button type="button" id="restart">Restart</button>
</div>
<p id="status" role="status" aria-live="polite"></p>
<p id="best" class="best"></p>
<button type="button" id="share" hidden>Copy result</button>
<p id="instructions" class="instructions">Move a tile next to the empty space, or use your arrow keys.</p>
<footer>
<p id="saved" class="note">Progress is stored on this device.</p>
<p class="note">Original offline puzzle · No advertisements · No accounts</p>
</footer>
</main>
<script src="./puzzle-core.js" defer></script>
<script src="./app.js" defer></script>
</body>
</html>
