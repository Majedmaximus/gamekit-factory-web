name: Godot 4.4.1 source tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'game/**'
      - '.github/workflows/godot-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          sudo mv Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
      - name: Check project is present
        run: test -f game/project.godot
      - name: Import project
        run: godot --headless --path game --editor --quit
      - name: Engine tests
        run: godot --headless --path game --script res://tests/test_engine.gd
      - name: Release tests
        run: godot --headless --path game --script res://tests/test_release.gd
      - name: Render Godot interface in English and Arabic
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libx11-6 libxcursor1 libxinerama1 libxi6
          xvfb-run -a -s "-screen 0 1280x900x24" godot --path game --rendering-driver opengl3 --script res://tests/capture_visual.gd
          test -s /tmp/godot-visual-en.png
          test -s /tmp/godot-visual-ar.png
      - name: Upload visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-visual-screenshots
          path: /tmp/godot-visual-*.png
          if-no-files-found: warn
